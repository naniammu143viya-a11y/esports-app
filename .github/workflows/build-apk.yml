name: Build Expo APK with EAS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install project dependencies
        run: pnpm install

      - name: Build APK with EAS
        run: pnpm dlx eas-cli@latest build --platform android --profile preview --non-interactive
