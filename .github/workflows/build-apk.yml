name: Build Expo APK with EAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build APK with EAS
        working-directory: artifacts/bgmi-tournament
        run: pnpm dlx eas-cli@latest build --platform android --profile preview --non-interactive