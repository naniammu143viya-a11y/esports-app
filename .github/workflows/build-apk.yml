name: Build Android APK

on:
  workflow_dispatch:

env:
  APP_DIR: artifacts/bgmi-tournament
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build-apk:
    name: Build Expo APK with EAS
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.1

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build APK with EAS
        working-directory: ${{ env.APP_DIR }}
        run: |
          pnpm dlx eas-cli@latest login --token ${{ secrets.EXPO_TOKEN }}
          echo '{"expo": {"name": "BGMI Tournament", "slug": "bgmi-tournament", "version": "1.0.0", "extra": {"eas": {"projectId": "92576ef7-ce98-450f-90e6-b9306e2173a2"}}}}' > app.json
          pnpm dlx eas-cli@latest build --platform android --profile preview --non-interactive
