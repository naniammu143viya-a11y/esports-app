kind = "mobile"
previewPath = "/"
title = "BGMI & Free Fire Tournaments"
version = "1.0.0"
id = "artifacts/bgmi-tournament"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19184

[services.development]
run = "pnpm --filter @workspace/bgmi-tournament run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bgmi-tournament", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bgmi-tournament", "run", "serve" ]

[services.env]
PORT = "19184"
BASE_PATH = "/"
